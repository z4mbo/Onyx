[package]
name = "onyx-desktop"
version = "0.3.1"
description = "Coding agents, multimodal chat, and voice in one Rust-native desktop app"
authors = ["z4mbo and contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/z4mbo/Onyx"

[lib]
name = "onyx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
base64 = "0.22"
cap-std = "4.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
enigo = "0.6.1"
minisign-verify = "=0.2.5"
parking_lot = "0.12"
portable-pty = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "multipart", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.9", features = ["macos-private-api", "tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1.19", features = ["serde", "v4"] }
walkdir = "2.5"
which = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
