[package]
name = "onyx"
version = "0.10.1"
description = "Onyx voice dictation and web research assistant"
authors = ["Onyx contributors"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "onyx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri enables this feature for distributable builds. Keeping it explicit lets
# us produce a static portable from the Smart App Control-compatible profile.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22.1"
enigo = "0.6.1"
getrandom = "0.3.4"
keyring = "4.1.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "native-tls", "query", "system-proxy"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.2"
tokio = { version = "1.52.3", features = ["io-util", "net", "process", "time"] }
url = "2.5.8"
