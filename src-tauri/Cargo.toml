[package]
name = "zai"
version = "0.1.0"
description = "Rust-native desktop workspace for coding agents"
authors = ["z4mbo and contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/z4mbo/zAI"

[lib]
name = "zai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
cap-std = "4.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1.19", features = ["serde", "v4"] }
walkdir = "2.5"
which = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
