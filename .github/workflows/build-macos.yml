name: Build macOS Universal

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-macos.yml"
      - "onyx-source.parts/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-macos.yml"
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "rust-toolchain.toml"
      - "tsconfig.json"
      - "vite.config.ts"
      - "onyx-source.parts/**"

permissions:
  contents: read

jobs:
  build-macos:
    name: Universal app and DMG
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_SIGNING_IDENTITY: "-"
      MACOSX_DEPLOYMENT_TARGET: "10.15"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract build source
        shell: bash
        run: |
          set -euo pipefail
          expected_sha256="$(cat onyx-source.parts/SHA256)"
          cat onyx-source.parts/part-* > onyx-source.tar.gz
          echo "${expected_sha256}  onyx-source.tar.gz" | shasum -a 256 -c -
          rm -rf onyx-source.parts
          tar -xzf onyx-source.tar.gz
          rm onyx-source.tar.gz

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust and macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm test

      - name: Build universal Tauri bundles
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target universal-apple-darwin --bundles app,dmg

      - name: Package test artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')).version)")"
          app_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$app_path"
          test -n "$dmg_path"
          mkdir -p artifacts/macos
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "artifacts/macos/Onyx_${version}_macOS_universal.app.zip"
          cp "$dmg_path" "artifacts/macos/Onyx_${version}_macOS_universal.dmg"
          (cd artifacts/macos && shasum -a 256 ./* > SHA256SUMS.txt)

      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: Onyx-0.10.1-macOS-universal
          path: artifacts/macos/
          if-no-files-found: error
          retention-days: 14
