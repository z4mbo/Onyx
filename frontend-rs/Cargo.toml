[package]
name = "onyx-frontend"
version = "0.4.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
console_error_panic_hook = "0.1"
icondata = { version = "0.7", default-features = false, features = ["lucide"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3.103"
leptos = { version = "0.8.20", features = ["csr"] }
leptos_icons = "0.7.1"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"

[dependencies.web-sys]
version = "0.3.103"
features = [
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlElement",
  "HtmlIFrameElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "Navigator",
  "Storage",
  "UrlSearchParams",
  "Window",
]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
